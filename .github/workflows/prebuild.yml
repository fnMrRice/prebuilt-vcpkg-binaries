name: Prebuild public dependencies

"on":
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        type: choice
        required: true
        default: x64-windows-latest
        options:
          - x64-windows-latest
          - x64-windows-v142
          - x64-windows-static
          - x64-windows-static-release
          - x64-linux
          - all
      qt_version:
        description: Qt libraries to include
        type: choice
        required: true
        default: qt5
        options:
          - none
          - qt5
          - qt6

permissions:
  contents: read

concurrency:
  group: prebuild-${{ github.ref }}-${{ inputs.target }}-${{ inputs.qt_version }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: select
        shell: bash
        env:
          BUILD_TARGET: ${{ inputs.target }}
          QT_VERSION: ${{ inputs.qt_version }}
        run: |
          matrix=$(jq -c --arg target "$BUILD_TARGET" --arg qt "$QT_VERSION" '[.[] | select($target == "all" or .profile == $target) | select((.qt_versions | index($qt)) != null) | . + {qt_version: $qt, archive_name: (.triplet + (if $qt == "none" then "" else "-with-" + $qt end))}]' scripts/profiles.json)
          if [[ "$matrix" == '[]' ]]; then
            echo "Qt selection '$QT_VERSION' is not supported for target '$BUILD_TARGET'." >&2
            exit 2
          fi
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    name: ${{ matrix.profile }} (${{ matrix.qt_version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_MAX_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Ensure complete vcpkg version history
        run: |
          if [[ "$(git -C vcpkg rev-parse --is-shallow-repository)" == true ]]; then
            git -C vcpkg fetch --unshallow origin
          fi
      - name: Add MSBuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Initialize the MSVC developer environment
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REQUESTED_TOOLSET: ${{ matrix.toolset }}
        run: ./scripts/msvc-env.ps1
      - name: Prepare isolated directories
        env:
          BUILD_PROFILE: ${{ matrix.profile }}
          QT_VERSION: ${{ matrix.qt_version }}
        run: |
          work="$RUNNER_TEMP/prebuilt-vcpkg/$BUILD_PROFILE/$QT_VERSION"
          mkdir -p "$work/binary-cache" "$work/downloads"
          if command -v cygpath >/dev/null 2>&1; then work=$(cygpath -m "$work"); fi
          echo "PREBUILT_WORK_DIR=$work" >> "$GITHUB_ENV"
      - name: Restore source and tool downloads
        id: downloads
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.PREBUILT_WORK_DIR }}/downloads
          key: downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.profile }}-
            downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore binary cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.PREBUILT_WORK_DIR }}/binary-cache
          key: binaries-v1-${{ matrix.profile }}-${{ matrix.qt_version }}-${{ hashFiles('manifests/**', 'overlay-ports/**', 'triplets/**', '.gitmodules') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            binaries-v1-${{ matrix.profile }}-${{ matrix.qt_version }}-${{ hashFiles('manifests/**', 'overlay-ports/**', 'triplets/**', '.gitmodules') }}-
            binaries-v1-${{ matrix.profile }}-${{ matrix.qt_version }}-
            binaries-v1-${{ matrix.profile }}-
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: bash scripts/linux-prerequisites.sh
      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bootstrap vcpkg on Linux
        if: runner.os == 'Linux'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Build and package dependencies
        env:
          BUILD_PROFILE: ${{ matrix.profile }}
          QT_VERSION: ${{ matrix.qt_version }}
        run: bash scripts/build.sh "$BUILD_PROFILE" "$QT_VERSION"
      - name: Save source and tool downloads
        if: ${{ always() && !cancelled() && steps.downloads.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.PREBUILT_WORK_DIR }}/downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Save completed binary packages
        if: ${{ always() && !cancelled() && steps.cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.PREBUILT_WORK_DIR }}/binary-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload prebuilt packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive_name }}
          path: artifacts/${{ matrix.profile }}/${{ matrix.qt_version }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.archive_name }}
          path: |
            artifacts/${{ matrix.profile }}/${{ matrix.qt_version }}/*.log
            vcpkg/buildtrees/**/*.log
            ${{ env.PREBUILT_WORK_DIR }}/installed/vcpkg/issue_body.md
          if-no-files-found: ignore
          retention-days: 7
