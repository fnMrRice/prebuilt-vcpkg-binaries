name: Update vcpkg baseline

"on":
  schedule:
    # First day of each month at 09:17 Hong Kong time (01:17 UTC).
    - cron: '17 1 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-vcpkg-baseline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      UPDATE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: true
      - name: Update the submodule and public baselines
        run: bash scripts/update-vcpkg.sh
      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail
          git add vcpkg manifests/default/vcpkg-configuration.json manifests/win7/vcpkg-configuration.json
          if git diff --cached --quiet; then
            echo 'vcpkg and public baselines are already up to date.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c commit.gpgsign=false commit -m 'chore(deps): update vcpkg and public baselines'
          git push origin "HEAD:$UPDATE_BRANCH"
          printf '\nUpdated in commit `%s`.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
